<html lang="fa" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="color-scheme" content="dark">
<meta name="description" content="منوی دیجیتال کافه گم">
<title>منوی دیجیتال کافه گم</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#2c0103;--red:#d9202f;--mut:#d7bcbc}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#2c0103;scroll-padding-top:84px}
body{font-family:'Vazirmatn',Tahoma,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(ellipse 120% 90% at 40% 30%,#370105,#2c0103) #2c0103;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.app{max-width:430px;margin:0 auto;padding:22px 20px 48px;position:relative;overflow-x:clip}
header{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.badge{color:var(--red);font-weight:700;font-size:15px;padding-bottom:6px;border-bottom:2px solid var(--red)}
.logo{height:44px;width:auto}
.hero{position:relative;height:210px}
.skull{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:205px;pointer-events:none}
.hero p{position:absolute;right:0;bottom:6px;font-size:18px;line-height:1.9;z-index:2}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;display:flex;gap:2px;margin-top:14px;padding:5px;border:1px solid rgba(255,255,255,.45);border-radius:30px;background:rgba(44,1,3,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs i{position:absolute;top:5px;bottom:5px;left:0;border-radius:24px;background:var(--red);pointer-events:none}
.tabs.on i{transition:transform .35s cubic-bezier(.3,.8,.3,1),width .35s cubic-bezier(.3,.8,.3,1)}
.tabs button{position:relative;z-index:1;flex:1 0 auto;font:inherit;font-size:14px;color:#fff;background:none;border:0;border-radius:24px;padding:9px 13px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{font-weight:700}
.tabs button:focus-visible,.more:focus-visible{outline:2px solid #fff;outline-offset:2px}
h1{text-align:center;font-size:24px;font-weight:700;margin:40px 0 12px;scroll-margin-top:90px}
.rule{height:1px;margin-bottom:14px;background:rgba(255,255,255,.5)}
.tip{text-align:center;font-size:12.5px;color:var(--mut);margin-bottom:22px;transition:opacity .4s}
.tip.off{opacity:0}
.item{margin-bottom:22px;animation:rise .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.plate{width:min(272px,76vw);height:min(136px,38vw);margin:0 auto;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative;z-index:2}
.plate:active{cursor:grabbing}
.plate img{display:block;width:min(272px,76vw);height:min(272px,76vw);border-radius:50%;will-change:transform;pointer-events:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.plate.full{height:min(272px,76vw);z-index:1}
.card{display:flex;align-items:center;gap:14px;width:calc(min(272px,76vw) + 24px);margin:-19px auto 0;padding:33px 26px 14px;background:#290102;border:1px solid rgba(255,255,255,.08);border-radius:16px;position:relative;z-index:1}
.plate.full+.card{margin-top:-34px;padding-top:48px;z-index:2}
.info{flex:1;min-width:0}
.info h3{font-size:16px;font-weight:800;margin-bottom:5px}
.info p{font-size:11.5px;color:var(--mut);line-height:1.75}
.sep{align-self:center;width:1px;height:36px;background:rgba(255,255,255,.3)}
.price{width:73px;text-align:center;flex:none}
.price b{display:block;background:var(--red);border-radius:20px;padding:4px 0;font-size:15px;font-weight:700;margin-bottom:4px}
.price small{font-size:11px;color:var(--mut)}
.more{display:flex;flex-direction:column;align-items:center;gap:2px;margin:34px auto 0;font:inherit;color:#fff;background:none;border:0;cursor:pointer;padding:8px 18px}
.more b{font-size:17px;font-weight:400}
.more small{font-size:12px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.item{animation:none}.tabs.on i{transition:none}}
</style>
</head>

function spin(el){
  var img=el.querySelector('img'),R=img.offsetWidth/2||136;
  var s={a:Math.random()*360,v:BASE,vel:0,drag:false,hover:false,vis:true,id:null,x:0,t:0,img:img};

  el.addEventListener('pointerdown',function(e){
    s.drag=true;s.id=e.pointerId;s.x=e.clientX;s.t=e.timeStamp;s.vel=0;hideTip();
    try{el.setPointerCapture(e.pointerId)}catch(_){}
  });
  el.addEventListener('pointermove',function(e){
    if(!s.drag||e.pointerId!==s.id)return;
    var cy=el.getBoundingClientRect().top+img.offsetHeight/2,
        da=(e.clientX-s.x)/R*57.3*(e.clientY<cy?1:-1),dt=(e.timeStamp-s.t)/1000;
    s.a=(s.a+da)%360;
    if(dt>0)s.vel=s.vel*.6+(da/dt)*.4;
    s.x=e.clientX;s.t=e.timeStamp;
    img.style.transform='rotate('+s.a+'deg)';
  });
  function end(){if(!s.drag)return;s.drag=false;s.v=Math.max(-900,Math.min(900,s.vel))}

  el.addEventListener('pointerleave',function(){s.hover=false});
}
